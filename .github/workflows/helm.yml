name: Helm chart

on:
  pull_request:
  push:
    branches:
      - "master"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout@7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Helm
        # azure/setup-helm v5.0.1
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
      - name: Lint chart
        run: helm lint helm_chart/request-dumper
      - name: Render optional resources
        run: helm template request-dumper helm_chart/request-dumper --set ingress.enabled=true --set autoscaling.enabled=true