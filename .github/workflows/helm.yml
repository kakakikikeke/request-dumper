name: Helm chart

on:
  pull_request:
  push:
    branches:
      - "master"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint helm_chart/request-dumper
      - name: Render optional resources
        run: helm template request-dumper helm_chart/request-dumper --set ingress.enabled=true --set autoscaling.enabled=true