apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "request-dumper.fullname" . }}-test-connection"
  labels:
    {{- include "request-dumper.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox:1.36.1
      command: ['wget']
      args: ['-qO-', 'http://{{ include "request-dumper.fullname" . }}:{{ .Values.service.port }}/']
  restartPolicy: Never
